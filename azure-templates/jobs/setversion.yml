jobs:
- job: BuildVersionSetter
  displayName: Set version
  pool:
    vmImage: ubuntu-latest
  steps:
    - task: DownloadBuildArtifacts@1
      inputs:
        buildType: 'specific'
        project: '5f808919-bffc-45c7-b4a3-4a10d5fa5832'
        pipeline: '5381'
        buildVersionToDownload: 'latest'
        downloadType: 'specific'
        downloadPath: '$(Build.SourcesDirectory)'

    - task: PowerShell@2
      name: buildsetter
      inputs:
        targetType: 'inline'
        script: |
          Write-Host "buildver: $(buildVersion)"

          # PR builds: version by the branch the PR targets.
          # Other builds: version by the branch being built.
          if ($env:BUILD_REASON -eq 'PullRequest') {
            $branch = $env:SYSTEM_PULLREQUEST_TARGETBRANCH
          } else {
            $branch = $env:BUILD_SOURCEBRANCH
          }
          $branch = $branch -replace '^refs/heads/', ''
          Write-Host "Resolved branch: $branch (reason: $env:BUILD_REASON)"

          if ($branch -eq 'develop' -or $branch.StartsWith('feature/')) {
            $file = "$(Build.SourcesDirectory)/drop/DevelopVersion.txt"
          } else {
            $file = "$(Build.SourcesDirectory)/drop/MasterVersion.txt"
          }

          # Trim and write back, as before
          $content = [System.IO.File]::ReadAllText($file).Trim()
          [System.IO.File]::WriteAllText($file, $content)

          if ($content -notmatch '^\d+\.\d+(\.\d+)?$') { throw "Invalid version format: $content" }

          $assembly_version = "$content.$(buildVersion)"
          Write-Host $assembly_version
          Write-Host "##vso[task.setvariable variable=assembly_version;isoutput=true]$assembly_version"
